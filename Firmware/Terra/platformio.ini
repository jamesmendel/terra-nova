; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Terra]
platform = espressif32@6.3.2
; platform_packages = 
;     framework-arduinoespressif32@3.20014.0
	; Core version > 2.014 was not working with TFT_eSPI, causing crash at boot.
	; see: https://github.com/Bodmer/TFT_eSPI/issues/3346
board = esp32-s3-devkitc-1
board_name = "ESP32-S3 4MB FLASH 2MB PSRAM"

board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.memory_type = qio_opi
board_build.partitions = min_spiffs.csv
board_build.extra_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue

framework = arduino
board_build.variant = esp32s3_terra

; board_build_arduino.partitions = esp32s3_terra
upload_protocol = esptool
upload_port = /dev/cu.usbmodem21201
upload_speed = 921600
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder
; monitor_raw = yes
build_flags =
	; Custom board variant:
	-Ivariants/esp32s3_terra
	-include $PROJECT_DIR/include/TFT_eSPI_config.h
	-DCONFIG_LOG_COLORS=1
	-DCORE_DEBUG_LEVEL=4
	-DCONFIG_ARDUHAL_LOG_COLORS=1
extra_scripts =
	pre:build_meta.py
	scripts/merge_firmware.py
custom_version = 0.0.1
lib_deps = 
	mikalhart/TinyGPSPlus@^1.1.0
	bodmer/TFT_eSPI@^2.5.43
	adafruit/Adafruit DRV2605 Library@^1.2.4
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit Unified Sensor@^1.1.15